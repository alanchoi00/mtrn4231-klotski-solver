arm_manipulator:
  ros__parameters:
    # tf_node
    use_dynamic_board_pose: true  # 启用从/board_pose话题更新位姿
    # MoveIt planning parameters - Optimized for safety and predictability
    planning_time: 10.0 # (s)
    num_planning_attempts: 5
    max_velocity_scaling_factor: 0.05
    max_acceleration_scaling_factor: 0.05
    planner_id: "RRTConnectkConfigDefault"

    # Robot-specific parameters
    robot_ip: "192.168.0.100"
    planning_group: "ur_manipulator"

    # Height parameters (in meters)
    board_height: 0.008      # 8mm
    block_height: 0.015      # 15mm
    gripper_height: 0.191    # 191mm

    # Calculated height offsets (in meters)
    approach_offset: 0.15     # Height above grip position for approach
    retreat_offset: 0.3      # Height above grip position for retreat (needs to be high enough for camera recapture)

    # Board geometry (in meters)
    # SIM
    board_center_x: 0.60     # X position of board center in base_link frame
    board_center_y: 0.425    # Y position of board center in base_link frame
    # LAB
    # board_center_x: 0.13346     # X position of board center in base_link frame
    # board_center_y: -0.58839    # Y position of board center in base_link frame
    board_width: 0.20        # Width of board (4 cells)
    board_length: 0.25       # Length of board (5 cells)
    cell_size: 0.05          # Size of each grid cell

    # Joint constraints (in degrees) - Help reduce search space for faster planning
    elbow_min_angle: 60.0    # Minimum elbow angle
    elbow_max_angle: 150.0   # Maximum elbow angle
    elbow_constraint_weight: 1.0

    # Additional joint limits to speed up planning
    shoulder_pan_min_angle: -180.0   # Base rotation limits
    shoulder_pan_max_angle: 180.0
    shoulder_lift_min_angle: -90.0   # Shoulder lift limits (avoid extreme positions)
    shoulder_lift_max_angle: 0.0
    wrist_1_min_angle: -135.0        # Wrist 1 limits
    wrist_1_max_angle: -45.0
    joint_constraint_weight: 0.5     # Lower weight for additional constraints

    # Cartesian path planning parameters
    cartesian_eef_step: 0.005         # End-effector step size for Cartesian paths (meters) - smaller for smoother motion
    cartesian_jump_threshold: 0.0     # Jump threshold for Cartesian paths (0.0 = disabled)
    cartesian_fraction_threshold: 0.95 # Minimum fraction of path that must be valid (high for safety)

    # Trajectory smoothing parameters
    enable_trajectory_smoothing: true   # Enable for smoother motion
    replan_attempts: 2                   # Reduced for faster execution

    # Fast planning mode (prioritize speed over optimality)
    fast_planning_mode: true             # Use faster settings when enabled

